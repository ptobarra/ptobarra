name: Update Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: update-activity-graph
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-activity-graph
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        timeout-minutes: 5
        continue-on-error: true
        with:
          username: ptobarra
          options: "bg_color=141321&color=a9fef7&title_color=fe428e&line=fe428e&point=f8d847&area_color=fe428e&area=true&hide_border=true"
          output_path: dist/activity-graph.svg

      - name: Fetch streak stats SVG
        timeout-minutes: 10
        continue-on-error: true
        run: |
          mkdir -p dist
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -m 90 \
            "https://streak-stats.demolab.com/?user=ptobarra&theme=radical&hide_border=true" \
            -o dist/streak-stats.svg.tmp \
            && mv dist/streak-stats.svg.tmp dist/streak-stats.svg

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: update activity graph SVG"
          file_pattern: "dist/*.svg"